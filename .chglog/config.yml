style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/buildoutinc/injector
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
        - docs
  commit_groups:
    title_maps:
      feat: Features
      fix: Fixes
      perf: Performance
      refactor: Refactor
      docs: Documentation
  header:
    pattern: "^(\\w+)(?:\\(([\\w\\$\\.\\-\\*\\s]+)\\))?\\!?:\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
